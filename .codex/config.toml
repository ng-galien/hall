model = "gpt-6-astra"

[mcp_servers.code-moniker]
args = [
    "mcp",
    "/Users/user/dev/projects/mairie",
    "--transport",
    "stdio",
    "--live-refresh",
    "auto",
]
command = "/Users/user/.cargo/bin/code-moniker"
required = false
startup_timeout_sec = 45
tool_timeout_sec = 120

[mcp_servers.code-moniker.tools.code_moniker_read]
approval_mode = "approve"

[mcp_servers.code-moniker.tools.code_moniker_context]
approval_mode = "approve"

[mcp_servers.hall-workspace]
url = "http://127.0.0.1:3100/mcp"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.trust]
url = "http://127.0.0.1:4498/mcp"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 120
