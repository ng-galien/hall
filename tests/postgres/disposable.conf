# Disposable test clusters only. Recreate the cluster after a crash.
# Keep schema constraints, triggers, transactions and autovacuum enabled.
fsync = off
synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0
checkpoint_timeout = '1h'
max_wal_size = '2GB'
shared_buffers = '256MB'
work_mem = '16MB'
maintenance_work_mem = '128MB'
jit = off
