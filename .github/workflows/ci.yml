name: Hall test gate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Code Moniker
        run: cargo install --git https://github.com/ng-galien/code-moniker.git --rev 1f44b7ff574d35362d18f817beb5d93986ebbdb3 --locked code-moniker
      - name: Install Hall dependencies
        run: npm ci
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run the complete serial gate
        run: npm run test:all
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            packages/client/test-results/
            packages/client/playwright-report/
          if-no-files-found: ignore
