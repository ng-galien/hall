name: Hall demonstration release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: hall-demonstration-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  make:
    name: Build the ${{ matrix.name }} demonstration
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: hall-demonstration-windows-x64
          - name: macOS arm64
            os: macos-latest
            artifact: hall-demonstration-macos-arm64
          - name: macOS x64
            os: macos-15-intel
            artifact: hall-demonstration-macos-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: hall-demonstration-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Verify the tag matches the application version
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const expected = "v" + JSON.parse(fs.readFileSync("packages/desktop/package.json", "utf8")).version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match ${expected}`);'
      - name: Install the RPM packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg
      - name: Install Hall dependencies
        run: npm ci
      - name: Identify current build inputs
        id: inputs
        run: |
          echo "key=$(node scripts/testing/build.mjs --key)" >> "$GITHUB_OUTPUT"
          echo "prefix=$(node scripts/testing/build.mjs --prefix)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore compilation candidates for validation
        uses: actions/cache@v6.1.0
        with:
          key: hall-build-v2-${{ steps.inputs.outputs.key }}
          restore-keys: |
            hall-build-v2-${{ steps.inputs.outputs.prefix }}-
          path: |
            packages/contracts/dist
            packages/api-contract/dist
            packages/domain/dist
            packages/mcp/dist
            packages/templating/dist
            packages/postgres/dist
            packages/server/dist
            packages/client/dist
            node_modules/.cache/hall/
      - run: npm run build:verified
      - name: Build the standalone server and MCP package
        if: runner.os == 'Linux'
        run: npm run pack:distribution -- --prebuilt
      - name: Retain the exact server candidate before desktop packaging
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hall-server-candidate
          retention-days: 7
          path: dist/npm/*.tgz*
          if-no-files-found: error
      - name: Package the current demonstration edition
        run: npm run make -w @hall/desktop
        env:
          HALL_DESKTOP_EDITION: demonstration
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          path: |
            packages/desktop/out/make/**/*.exe
            packages/desktop/out/make/**/*.nupkg
            packages/desktop/out/make/**/RELEASES
            packages/desktop/out/make/**/*.dmg
            packages/desktop/out/make/**/*.deb
            packages/desktop/out/make/**/*.rpm
            dist/npm/*.tgz*
          if-no-files-found: error

  draft-release:
    name: Attach the executables to a draft release
    needs: make
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Write the release notice
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTICE'
          Hall accompagne le travail d’un conseil municipal : préparation des affaires, conduite des séances, procès-verbaux et actes.

          Cette version est une démonstration. Au premier lancement, l’application charge la commune fictive d’Alésia et s’ouvre connectée en tant que son administrateur, sans compte à créer ni mot de passe à saisir. Tout fonctionne sur l’ordinateur, avec une base de données embarquée ; rien n’est envoyé à un serveur. Le menu **Démonstration** remet le jeu de données à zéro.
          NOTICE
          if [ "$TAG" = "v1.3.0" ]; then
            cat >> "$RUNNER_TEMP/notes.md" <<'NOTICE'

          ## Nouveautés de la version 1.3.0

          - Interface refaite sur ordinateur et sur téléphone : écrans blancs, un en-tête par écran avec un grand titre, des boutons et des champs de saisie de même forme partout.
          - Menu en trois blocs : Accueil ; Conseil municipal, Documents, Courriels, Agenda ; Contacts, Cartes, Administration. Sur téléphone, « Plus » présente les autres écrans en grille d’icônes, par catégorie.
          - Un seul bouton « + Nouveau » pour créer une note, une photo, une image, un fichier ou un autre élément.
          - États écrits dans des pastilles de couleur : vert pour ce qui est réglé, orange pour ce qui attend une action, rouge pour ce qui bloque, gris pour le reste.
          - Un contenu se déplie et se replie par un carré « + / − » placé devant sa ligne.
          - Les explications d’un écran sont derrière l’icône d’information placée après son titre.
          - Les dates de l’année en cours s’écrivent sans l’année, par exemple « 17 octobre ».
          - Un texte ou le rapport d’une affaire s’ouvre en lecture ; « Modifier » permet de l’écrire, « Terminé » l’enregistre.
          - Le mandat et les lieux de séance sont dans l’écran Commune.
          - L’état de la connexion ne s’affiche plus que lorsque le serveur ne répond pas : « Serveur injoignable ».
          - Courriels : brouillons communs, groupes de destinataires, pièces jointes, relecture avant envoi et historique des envois, par la messagerie de la mairie.
          - Page d’une séance close : début, fin, durée, quorum, président et secrétaire, nombres de présents, représentés, excusés et absents ; documents de la séance avec « Ouvrir le PDF » ; liste des délibérations ; déroulé de chaque point, avec le vote de chaque conseiller à déplier.
          - Mot de passe par lien à usage unique, envoyé par courriel : invitation à la création d’un compte, valable sept jours ; « Envoyer un lien de réinitialisation » depuis la page d’un utilisateur ; « Mot de passe oublié ? » sur l’écran de connexion, lien valable une heure. Chaque changement de mot de passe est confirmé par courriel.
          - Un mot de passe remis en main propre peut être marqué temporaire : la personne en choisit un autre avant d’utiliser Hall.
          - Contacts : trois numéros de téléphone, mobile, personnel et professionnel. Un numéro français s’écrit par paires de chiffres ; un texte qui n’est pas un numéro est refusé. L’ancien numéro est repris automatiquement, ou recopié dans les notes s’il n’est pas lisible. Sur un écran tactile, un numéro appelle le contact.
          - Séance : un déport enregistré peut être retiré tant que le résultat du vote du point n’est pas enregistré ; le conseiller vote de nouveau.
          - Séance : un clic droit sur un votant l’envoie à « Pour », « Contre » ou « Abstention », ou ouvre la déclaration de déport.
          - Corrections : le nouveau nom d’un élément est conservé quand un enregistrement était en cours ; une image insérée pendant un enregistrement est conservée ; un texte comme « 19:30 » s’affiche tel quel dans les aperçus PDF et les courriels.

          La version 1.3.0 modifie le schéma de la base de données. Pour un serveur existant en 1.2.0, suivre la [procédure de mise à jour](https://github.com/ng-galien/hall/blob/v1.3.0/docs/distribution.md#update-procedure-from-120-to-130-on-the-municipal-computer). La mise à jour demande un arrêt du serveur et une sauvegarde vérifiée ; revenir en 1.2.0 nécessite de restaurer cette sauvegarde. Au premier lancement de la nouvelle version, la démonstration recharge la commune d’Alésia ; les modifications faites dans la démonstration précédente ne sont pas conservées.
          NOTICE
          fi
          cat >> "$RUNNER_TEMP/notes.md" <<'NOTICE'

          ## Téléchargements

          - Windows : le fichier `windows-x64-…Setup.exe`.
          - macOS, puce Apple : le fichier `macos-arm64-Hall-…-arm64.dmg`.
          - macOS, processeur Intel : le fichier `macos-x64-Hall-…-x64.dmg`.
          - Linux : le fichier `linux-x64-….deb` (Debian, Ubuntu) ou `linux-x64-….rpm` (Fedora, openSUSE).

          Les fichiers `.nupkg` et `RELEASES` servent aux mises à jour Windows ; ils ne sont pas à ouvrir.

          ## Installer la démonstration

          Hall est gratuit. La démonstration fonctionne entièrement sur votre ordinateur. Rien n’est envoyé sur Internet.

          Hall n’est pas signé auprès d’Apple ni de Microsoft. Votre ordinateur affiche donc un avertissement la première fois. C’est normal. L’avertissement ne s’affiche qu’une seule fois. Ensuite, Hall s’ouvre comme une application ordinaire.

          Téléchargez Hall uniquement depuis la page officielle des versions de Hall sur GitHub.

          ### Windows 10 et Windows 11

          Fichier à télécharger : celui dont le nom commence par `windows-x64` et se termine par `Setup.exe`.

          1. Cliquez sur le fichier qui se termine par `Setup.exe`. Le téléchargement commence.
          2. Le navigateur peut dire que ce fichier est rarement téléchargé. Choisissez de conserver le fichier. Ce message vient du navigateur, pas de Hall.
          3. Ouvrez le dossier **Téléchargements** et double-cliquez sur le fichier.
          4. Une fenêtre bleue s’affiche : « Windows a protégé votre ordinateur ». Il n’y a qu’un bouton **Ne pas exécuter**. Ne cliquez pas dessus. Cliquez sur le lien **Informations complémentaires**, sous le texte.
          5. Le nom du fichier s’affiche, avec « Éditeur inconnu ». Un nouveau bouton apparaît en bas. Cliquez sur **Exécuter quand même**.
          6. Hall s’installe tout seul, sans question. Cela prend quelques secondes. Un raccourci **Hall** est ajouté sur le Bureau et dans le menu Démarrer, puis Hall s’ouvre.
          7. Une carte de France s’anime, puis la commune d’Alésia et le bouton **Ouvrir Hall**. Attendez que le bouton soit actif, puis cliquez dessus. La première fois, la préparation prend quelques minutes.

          Pour rouvrir Hall plus tard : double-cliquez sur le raccourci **Hall** du Bureau, ou ouvrez le menu Démarrer et tapez « Hall ».

          Si la fenêtre dit que le « Contrôle intelligent des applications » a bloqué Hall, il n’existe pas de bouton pour continuer. Windows 11 bloque alors toutes les applications non signées. Hall ne peut pas s’installer sur cet ordinateur tant que ce contrôle reste actif.

          Sur un ordinateur géré par une entreprise ou une collectivité, le bouton **Exécuter quand même** peut être absent. Demandez à la personne qui s’occupe de l’informatique.

          ### macOS 14 Sonoma, macOS 15 Sequoia et versions plus récentes

          Fichier à télécharger : celui qui se termine par `.dmg`. Mac avec puce Apple (M1, M2, M3, M4…) : le fichier `macos-arm64`. Mac avec processeur Intel : le fichier `macos-x64`. Pour savoir lequel prendre : menu Pomme, **À propos de ce Mac**. La ligne « Puce » indique une puce Apple ; la ligne « Processeur » indique Intel.

          **Installer Hall**

          1. Cliquez sur le fichier qui se termine par `.dmg` et qui correspond à votre Mac.
          2. Ouvrez le dossier **Téléchargements** et double-cliquez sur le fichier. Une fenêtre s’ouvre avec l’icône de Hall et le dossier **Applications**.
          3. Faites glisser l’icône de Hall sur le dossier **Applications**. Fermez ensuite cette fenêtre.
          4. Ouvrez le dossier **Applications** et double-cliquez sur Hall.
          5. Une fenêtre s’affiche : « Apple ne peut pas vérifier que « Hall » ne contient pas de logiciel malveillant ». Le texte peut varier un peu selon la version. Cliquez sur **Terminé** ou **OK**. Ne cliquez pas sur **Placer dans la corbeille**.

          **Ouvrir Hall la première fois sur macOS 15 Sequoia et plus récent**

          1. Ouvrez le menu Pomme, en haut à gauche, puis **Réglages Système**.
          2. Dans la colonne de gauche, cliquez sur **Confidentialité et sécurité**. Faites défiler vers le bas jusqu’à la partie **Sécurité**.
          3. Un message indique que « Hall » a été bloqué. Cliquez sur **Ouvrir quand même**, à côté de ce message. Ce bouton reste affiché environ une heure après votre essai d’ouverture.
          4. Une fenêtre demande encore si vous voulez ouvrir Hall. Cliquez sur **Ouvrir quand même** ou **Ouvrir**.
          5. Le Mac demande votre mot de passe. Tapez le mot de passe que vous utilisez pour ouvrir votre session sur le Mac, puis cliquez sur **OK**.

          **Ouvrir Hall la première fois sur macOS 14 Sonoma**

          1. Dans le dossier **Applications**, cliquez sur Hall en maintenant la touche **control** enfoncée, ou faites un clic droit. Choisissez **Ouvrir** dans le menu.
          2. Une fenêtre demande si vous voulez ouvrir Hall. Cliquez sur **Ouvrir**.

          **Ensuite, sur toutes les versions**

          Une carte de France s’anime, puis la commune d’Alésia et le bouton **Ouvrir Hall**. Attendez que le bouton soit actif, puis cliquez dessus. La première fois, la préparation prend quelques minutes. Les fois suivantes, Hall s’ouvre directement depuis le dossier **Applications** ou le Launchpad.

          Si le Mac dit que « Hall » est endommagé : ouvrez l’application **Terminal** (dans **Applications**, puis **Utilitaires**). Copiez cette ligne, collez-la, puis appuyez sur la touche Entrée :

          ```
          xattr -dr com.apple.quarantine /Applications/Hall.app
          ```

          Ouvrez ensuite Hall à nouveau.

          ### Linux : Ubuntu, Debian et Fedora

          Fichier à télécharger : pour Ubuntu ou Debian, celui qui se termine par `.deb` ; pour Fedora, celui qui se termine par `.rpm`. Ces fichiers sont prévus pour les ordinateurs à processeur Intel ou AMD. Linux n’affiche pas d’avertissement de signature. Le mot de passe sert seulement à installer l’application.

          **Ubuntu et Debian**

          1. Ouvrez le dossier **Téléchargements** et double-cliquez sur le fichier `.deb`. Sur Ubuntu, le Centre d’applications s’ouvre.
          2. Le Centre d’applications prévient que ce paquet ne vient pas d’Ubuntu. Cliquez sur **Installer**, puis tapez votre mot de passe.
          3. Si le double-clic n’ouvre rien, ou affiche une erreur : ouvrez l’application **Terminal** depuis la liste des applications. Copiez cette ligne, collez-la, appuyez sur Entrée, puis tapez votre mot de passe :

          ```
          sudo apt install "$(xdg-user-dir DOWNLOAD)"/linux-x64-*.deb
          ```

          **Fedora**

          1. Ouvrez le dossier **Téléchargements** et double-cliquez sur le fichier `.rpm`. L’application **Logiciels** s’ouvre.
          2. Cliquez sur **Installer**, puis tapez votre mot de passe.
          3. Si le double-clic n’ouvre rien, ou affiche une erreur : ouvrez l’application **Terminal** depuis la liste des applications. Copiez cette ligne, collez-la, appuyez sur Entrée, puis tapez votre mot de passe :

          ```
          sudo dnf install "$(xdg-user-dir DOWNLOAD)"/linux-x64-*.rpm
          ```

          **Ouvrir Hall**

          Cherchez « Hall » dans la liste des applications et cliquez dessus. Une carte de France s’anime, puis la commune d’Alésia et le bouton **Ouvrir Hall**. Attendez que le bouton soit actif, puis cliquez dessus. La première fois, la préparation prend quelques minutes.

          ## Licence

          Hall est distribué sous la licence publique de l’Union européenne, version 1.2 (EUPL-1.2). Titulaire des droits : Alexandre Boyer. Le texte de la licence est dans le fichier [LICENSE](https://github.com/ng-galien/hall/blob/main/LICENSE) du dépôt.

          *Hall, le conseil municipal en séance.*
          NOTICE
      - name: Prepare a draft only after complete exact-source validation
        run: |
          node scripts/distribution/release-publication.mjs prepare \
            --tag "$TAG" \
            --build-run "$GITHUB_RUN_ID" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --wait-seconds 1800
