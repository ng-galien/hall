fragment = "server"

[aliases]
persistence_at_server_source = "source ~ '**/dir:packages/dir:server/dir:src/dir:repositories/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:infrastructure/dir:database/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:infrastructure/dir:postgres/**'"
composition_at_server_source = "source ~ '**/dir:packages/dir:server/dir:src/dir:core/module:container/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:core/module:localServer/**'"
database_test_support_source = "source ~ '**/dir:packages/dir:server/dir:src/dir:__tests__/dir:support/**'"
persistence_at_server_decoder_target = "target ~ '**/dir:packages/dir:server/dir:src/dir:repositories/module:row/**'"

[[refs.where]]
id = "persistence@server-composition@server-ownership-confines-database"
severity = "error"
rationale = "Database adapters belong to server persistence. The container wires them and localServer owns the embedded runtime lifecycle. HTTP and business services must not open a database."
expr = "$server_source AND $dependency_import_ref AND $database_target => ($persistence_at_server_source OR $composition_at_server_source OR $database_test_support_source)"
message = "Server database imports are limited to persistence, the composition root, and dedicated test support."

[[refs.where]]
id = "persistence@server-ownership-confines-row-decoding"
severity = "error"
rationale = "Database rows and serialized discriminants are external data. Repository mappers validate them once before services receive domain values; importing those decoders from HTTP or business services would leak storage representation beyond persistence."
expr = "$server_source AND $dependency_import_ref AND $persistence_at_server_decoder_target => $persistence_at_server_source"
message = "Persisted row decoders may only be imported by server persistence adapters."
