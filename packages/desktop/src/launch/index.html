<!doctype html>
<html lang="fr" data-state="loading">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
    <title>Hall</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <main class="launch-stage" id="stage" data-testid="launch-stage" aria-hidden="true"></main>
    <div class="launch-relief-names" id="relief-names" aria-hidden="true"></div>
    <div class="launch-cities" id="cities" aria-hidden="true"></div>
    <div class="launch-scrim"></div>
    <ol class="launch-story-list" id="story-list" data-testid="launch-story-list" aria-label="Lieux du récit d’Alésia"></ol>
    <section class="launch-brand" data-testid="launch-brand" aria-live="polite">
      <div class="launch-title">
        <h1 class="launch-name">Hall</h1>
        <p class="launch-tagline" data-testid="launch-tagline">
          <span class="launch-dash" aria-hidden="true"></span><span class="launch-tagline-text">Pilotage de la commune</span>
        </p>
      </div>
      <p class="launch-place" data-testid="launch-place"></p>
      <p class="launch-note" data-testid="launch-note" hidden></p>
      <div class="launch-actions">
        <button class="launch-open" type="button" data-testid="launch-open" disabled>
          <span class="launch-open-label">Ouvrir Hall</span>
          <kbd class="launch-key" aria-label="Touche Entrée">Entrée <span aria-hidden="true">↵</span></kbd>
        </button>
        <div
          class="launch-progress"
          data-testid="launch-loader"
          role="progressbar"
          aria-label="Préparation de Hall"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="launch-progress-head">
            <span class="launch-progress-step" data-testid="launch-step">Préparation de l’espace de travail</span>
            <span class="launch-progress-count" data-testid="launch-step-count"></span>
          </div>
          <div class="launch-scale" aria-hidden="true">
            <span class="launch-scale-segment" data-state="pending"></span>
          </div>
        </div>
      </div>
    </section>
    <script type="module" src="./main.js"></script>
  </body>
</html>
