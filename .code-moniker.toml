default_rules = false

[[workspace.source_group]]
roots = [
  { path = "packages/api-contract/src", srcset = "main" },
  { path = "packages/client/src", srcset = "main" },
  { path = "packages/desktop/src", srcset = "main" },
  { path = "packages/domain/src", srcset = "main" },
  { path = "packages/postgres/src", srcset = "main" },
  { path = "packages/server/src", srcset = "main" },
  { path = "packages/templating/src", srcset = "main" },
]

[rules.taxonomy]
patterns = ["dependency", "hygiene", "ownership"]
components = [
  "code",
  "domain",
  "postgres",
  "api-contract",
  "templating",
  "server",
  "authorization@server",
  "persistence@server",
  "composition@server",
  "editor-asset@server",
  "client",
  "technical-ui@client",
  "desktop",
  "database",
  "state-machine@domain",
]

[[shape.annotation.where]]
id = "code-hygiene-rejects-em-dashes"
severity = "error"
rationale = "Comments and generated or user-visible strings use simple punctuation. Rejecting em dashes keeps source prose consistent and prevents the typographic habit from spreading through copied text."
expr = "text !~ \\u{2014}"
message = "Replace the em dash with a comma, colon, semicolon, parentheses, or a plain hyphen as appropriate."

[[shape.annotation.where]]
id = "code-hygiene-rejects-comments-inside-callables"
severity = "error"
rationale = "Comments inside executable bodies usually restate control flow and let unclear agent-generated code accumulate. Hall keeps explanations at module or API boundaries and requires callable bodies to remain readable from names and structure."
expr = "parent.shape != 'callable'"
message = "Remove the comment from the function or method body. Make the code self-explanatory instead."

[[shape.value.where]]
id = "code-hygiene-rejects-em-dashes"
severity = "error"
rationale = "Comments and generated or user-visible strings use simple punctuation. Rejecting em dashes keeps source prose consistent and prevents the typographic habit from spreading through copied text."
expr = "text !~ \\u{2014}"
message = "Replace the em dash with a comma, colon, semicolon, parentheses, or a plain hyphen as appropriate."

[[shape.callable.where]]
id = "code-hygiene-rejects-em-dashes"
severity = "error"
rationale = "Comments and generated or user-visible strings use simple punctuation. Rejecting em dashes keeps source prose consistent and prevents the typographic habit from spreading through copied text."
expr = "text !~ \\u{2014}"
message = "Replace the em dash with a comma, colon, semicolon, parentheses, or a plain hyphen as appropriate."

[[shape.type.where]]
id = "code-hygiene-rejects-em-dashes"
severity = "error"
rationale = "Comments and generated or user-visible strings use simple punctuation. Rejecting em dashes keeps source prose consistent and prevents the typographic habit from spreading through copied text."
expr = "text !~ \\u{2014}"
message = "Replace the em dash with a comma, colon, semicolon, parentheses, or a plain hyphen as appropriate."

[exclude]
uris = [
  "**/node_modules/**",
  "**/dist/**",
  "**/out/**",
  "**/*.test.ts",
  "**/*.test.tsx",
]

[aliases]
dependency_import_ref = "kind = 'imports_symbol' OR kind = 'imports_module' OR kind = 'reexports'"
import_ref = "kind = 'imports_symbol' OR kind = 'imports_module' OR kind = 'reexports'"
domain_source = "source ~ '**/dir:packages/dir:domain/dir:src/**'"
postgres_source = "source ~ '**/dir:packages/dir:postgres/dir:src/**'"
api_contract_source = "source ~ '**/dir:packages/dir:api-contract/dir:src/**'"
templating_source = "source ~ '**/dir:packages/dir:templating/dir:src/**'"
client_source = "source ~ '**/dir:packages/dir:client/dir:src/**'"
server_source = "source ~ '**/dir:packages/dir:server/dir:src/**'"
authorization_at_server_source = "source ~ '**/dir:packages/dir:server/dir:src/dir:security/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:api/module:accessControl/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:api/module:apiCommandAuthorization/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:api/module:apiCommandPolicy/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:api/module:apiCommandResolution/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:api/module:sirenActionPolicy/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:api/module:sirenRepresentation/**'"
desktop_source = "source ~ '**/dir:packages/dir:desktop/dir:src/**'"
client_target = "target ~ '**/dir:packages/dir:client/dir:src/**' OR target.segment('external_pkg') = '@hall/client'"
domain_target = "target ~ '**/dir:packages/dir:domain/dir:src/**' OR target.segment('external_pkg') = '@hall/domain'"
postgres_target = "target ~ '**/dir:packages/dir:postgres/dir:src/**' OR target.segment('external_pkg') = '@hall/postgres'"
api_contract_target = "target ~ '**/dir:packages/dir:api-contract/dir:src/**' OR target.segment('external_pkg') = '@hall/api-contract'"
templating_target = "target ~ '**/dir:packages/dir:templating/dir:src/**' OR target.segment('external_pkg') = '@hall/templating'"
template_editor_at_client_source = "source ~ '**/dir:packages/dir:client/dir:src/dir:components/module:MarkdownEditor/**' OR source ~ '**/dir:packages/dir:client/dir:src/**/module:TemplateEditor/**'"
template_rendering_at_server_source = "source ~ '**/dir:packages/dir:server/dir:src/dir:services/module:templateRendering/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:services/module:contentTemplateService/**'"
server_target = "target ~ '**/dir:packages/dir:server/dir:src/**' OR target.segment('external_pkg') = '@hall/server'"
desktop_target = "target ~ '**/dir:packages/dir:desktop/dir:src/**' OR target.segment('external_pkg') = '@hall/desktop'"
database_target = "target ~ '**/sdk:ts/path:node:sqlite/**' OR target.segment('external_pkg') = 'pg' OR target ~ '**/dir:packages/dir:postgres/**' OR target.segment('external_pkg') = '@hall/postgres' OR target ~ '**/dir:infrastructure/dir:database/**' OR target ~ '**/dir:infrastructure/dir:sqlite/**' OR target ~ '**/dir:infrastructure/dir:postgres/**'"
state_machine_at_domain_source = "source ~ '**/dir:packages/dir:domain/dir:src/dir:state-machines/**'"
state_machine_runtime_target = "target ~ '**/external_pkg:xstate/**'"
authorization_at_server_permission_catalog_target = "target.name = 'apiPermissions'"
authorization_at_server_command_policy_target = "target ~ '**/dir:packages/dir:server/dir:src/dir:api/module:apiCommandPolicy/**'"
templating_grammar_runtime_target = "target ~ '**/external_pkg:unified/**' OR target ~ '**/external_pkg:remark-parse/**' OR target ~ '**/external_pkg:remark-stringify/**' OR target ~ '**/external_pkg:remark-directive/**' OR target ~ '**/external_pkg:remark-gfm/**' OR target ~ '**/external_pkg:remark-rehype/**' OR target ~ '**/external_pkg:rehype-stringify/**'"

[[refs.where]]
id = "templating-client-server-ownership-of-markdown-grammar-is-confined"
severity = "error"
rationale = "The template editor and authoritative template renderer must parse and validate exactly the same Markdown directives. The isomorphic templating package owns their unified/remark grammar; the generic Markdown viewer remains a separate presentation concern."
expr = "($templating_source OR $template_editor_at_client_source OR $template_rendering_at_server_source) AND $import_ref AND $templating_grammar_runtime_target => $templating_source"
message = "Markdown grammar runtimes belong exclusively to packages/templating."

[[refs.where]]
id = "authorization@server-client-server-ownership-of-permission-catalog-is-confined"
severity = "error"
rationale = "Roles grant coarse permissions and server-side state projects the currently valid Siren actions. The executable check confines imports of the permission catalog to the server authorization boundary; clients must follow advertised actions instead of rebuilding authorization policy."
expr = "($server_source OR $client_source) AND (kind = 'imports_symbol' OR kind = 'imports_module' OR kind = 'reexports') AND $authorization_at_server_permission_catalog_target => $authorization_at_server_source"
message = "The permission catalog may only be consumed by the server authorization boundary."

[[refs.where]]
id = "authorization@server-ownership-of-command-policy-is-confined"
severity = "error"
rationale = "Every HTTP mutation is named by the shared ApiActionName contract, then receives its permissions and audit target from one exhaustive server policy. Confining direct policy imports prevents routes, services, and clients from rebuilding partial command catalogs."
expr = "$dependency_import_ref AND $authorization_at_server_command_policy_target => $authorization_at_server_source"
message = "The API command policy may only be consumed by the server authorization boundary."

[[refs.where]]
id = "client-server-dependency-does-not-cross-runtime-boundary"
severity = "error"
rationale = "The React renderer and the server are separate runtime adapters. They share English domain contracts and communicate over HTTP; direct implementation imports would make shared-server mode impossible to preserve."
expr = "($client_source OR $server_source) AND $dependency_import_ref => NOT (($client_source AND $server_target) OR ($server_source AND $client_target))"
message = "Client/server compile-time dependencies must not cross the runtime boundary."

[[refs.where]]
id = "database-ownership-keeps-client-desktop-out-of-database-drivers"
severity = "error"
rationale = "Only the authoritative server owns database access. Electron may start or connect to a server, but neither the desktop shell nor the React renderer may open SQLite or PostgreSQL directly; this allows multiple applications to share one database through one server."
expr = "($client_source OR $desktop_source) AND $dependency_import_ref => NOT $database_target"
message = "Database adapters belong to the server; clients must use the HTTP boundary."

[[refs.where]]
id = "desktop-client-dependency-crosses-http-not-source"
severity = "error"
rationale = "Electron hosts or connects to the HTTP server and loads the built renderer as web assets. A source import from desktop into the React client would couple packaging to renderer internals and blur the same boundary used by remote clients."
expr = "$desktop_source AND $dependency_import_ref => NOT $client_target"
message = "Electron must load the client over HTTP instead of importing renderer source."
