default_rules = false

[rules.taxonomy]
patterns = ["dependency", "ownership"]
components = [
  "domain",
  "api-contract",
  "templating",
  "server",
  "authorization@server",
  "persistence@server",
  "composition@server",
  "client",
  "desktop",
  "database",
  "state-machine@domain",
]

[exclude]
uris = [
  "**/node_modules/**",
  "**/dist/**",
  "**/out/**",
  "**/*.test.ts",
  "**/*.test.tsx",
]

[aliases]
dependency_import_ref = "kind = 'imports_symbol' OR kind = 'imports_module' OR kind = 'reexports'"
import_ref = "kind = 'imports_symbol' OR kind = 'imports_module' OR kind = 'reexports'"
domain_source = "source ~ '**/dir:packages/dir:domain/dir:src/**'"
api_contract_source = "source ~ '**/dir:packages/dir:api-contract/dir:src/**'"
templating_source = "source ~ '**/dir:packages/dir:templating/dir:src/**'"
client_source = "source ~ '**/dir:packages/dir:client/dir:src/**'"
server_source = "source ~ '**/dir:packages/dir:server/dir:src/**'"
authorization_at_server_source = "source ~ '**/dir:packages/dir:server/dir:src/dir:security/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:api/module:accessControl/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:api/module:sirenRepresentation/**'"
desktop_source = "source ~ '**/dir:packages/dir:desktop/dir:src/**'"
persistence_at_server_source = "source ~ '**/dir:packages/dir:server/dir:src/dir:repositories/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:infrastructure/dir:database/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:infrastructure/dir:sqlite/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:infrastructure/dir:postgres/**'"
composition_at_server_source = "source ~ '**/dir:packages/dir:server/dir:src/dir:core/module:container/**'"
client_target = "target ~ '**/dir:packages/dir:client/dir:src/**'"
domain_target = "target ~ '**/dir:packages/dir:domain/dir:src/**'"
api_contract_target = "target ~ '**/dir:packages/dir:api-contract/dir:src/**'"
templating_target = "target ~ '**/dir:packages/dir:templating/dir:src/**'"
template_editor_at_client_source = "source ~ '**/dir:packages/dir:client/dir:src/dir:components/module:MarkdownEditor/**' OR source ~ '**/dir:packages/dir:client/dir:src/**/module:TemplateEditor/**'"
template_rendering_at_server_source = "source ~ '**/dir:packages/dir:server/dir:src/dir:services/module:templateRendering/**' OR source ~ '**/dir:packages/dir:server/dir:src/dir:services/module:contentTemplateService/**'"
server_target = "target ~ '**/dir:packages/dir:server/dir:src/**'"
desktop_target = "target ~ '**/dir:packages/dir:desktop/dir:src/**'"
database_target = "target.name = 'DatabaseSync' OR target.name = 'Pool' OR target.name = 'PoolClient' OR target ~ '**/dir:infrastructure/dir:database/**' OR target ~ '**/dir:infrastructure/dir:sqlite/**' OR target ~ '**/dir:infrastructure/dir:postgres/**'"
state_machine_at_domain_source = "source ~ '**/dir:packages/dir:domain/dir:src/dir:state-machines/**'"
state_machine_runtime_target = "target ~ '**/external_pkg:xstate/**'"
authorization_at_server_permission_catalog_target = "target.name = 'apiPermissions'"
templating_grammar_runtime_target = "target ~ '**/external_pkg:unified/**' OR target ~ '**/external_pkg:remark-parse/**' OR target ~ '**/external_pkg:remark-stringify/**' OR target ~ '**/external_pkg:remark-directive/**' OR target ~ '**/external_pkg:remark-gfm/**' OR target ~ '**/external_pkg:remark-rehype/**' OR target ~ '**/external_pkg:rehype-stringify/**'"

[[refs.where]]
id = "templating-client-server-ownership-of-markdown-grammar-is-confined"
severity = "error"
rationale = "The template editor and authoritative template renderer must parse and validate exactly the same Markdown directives. The isomorphic templating package owns their unified/remark grammar; the generic Markdown viewer remains a separate presentation concern."
expr = "($templating_source OR $template_editor_at_client_source OR $template_rendering_at_server_source) AND $import_ref AND $templating_grammar_runtime_target => $templating_source"
message = "Markdown grammar runtimes belong exclusively to packages/templating."

[[refs.where]]
id = "api-contract-domain-server-client-desktop-dependency-remains-leaf"
severity = "error"
rationale = "The API contract is the transport vocabulary shared by server and client. It may depend on generic validation libraries, but importing domain or runtime adapters would turn it into a backdoor coupling layer and prevent either side from evolving behind the Siren boundary."
expr = "NOT ($api_contract_source AND $dependency_import_ref AND ($domain_target OR $server_target OR $client_target OR $desktop_target))"
message = "The shared API contract must not import domain or runtime adapters."

[[refs.where]]
id = "authorization@server-client-server-ownership-of-permission-catalog-is-confined"
severity = "error"
rationale = "Roles grant coarse permissions and server-side state projects the currently valid Siren actions. The executable check confines imports of the permission catalog to the server authorization boundary; clients must follow advertised actions instead of rebuilding authorization policy."
expr = "($server_source OR $client_source) AND (kind = 'imports_symbol' OR kind = 'imports_module' OR kind = 'reexports') AND $authorization_at_server_permission_catalog_target => $authorization_at_server_source"
message = "The permission catalog may only be consumed by the server authorization boundary."

[[refs.where]]
id = "client-server-dependency-does-not-cross-runtime-boundary"
severity = "error"
rationale = "The React renderer and the server are separate runtime adapters. They share English domain contracts and communicate over HTTP; direct implementation imports would make shared-server mode impossible to preserve."
expr = "($client_source OR $server_source) AND $dependency_import_ref => NOT (($client_source AND $server_target) OR ($server_source AND $client_target))"
message = "Client/server compile-time dependencies must not cross the runtime boundary."

[[refs.where]]
id = "database-ownership-keeps-client-desktop-out-of-database-drivers"
severity = "error"
rationale = "Only the authoritative server owns database access. Electron may start or connect to a server, but neither the desktop shell nor the React renderer may open SQLite or PostgreSQL directly; this allows multiple applications to share one database through one server."
expr = "NOT (($client_source OR $desktop_source) AND (kind = 'imports_symbol' OR kind = 'imports_module' OR kind = 'reexports') AND $database_target)"
message = "Database adapters belong to the server; clients must use the HTTP boundary."

[[refs.where]]
id = "domain-server-client-desktop-dependency-points-outward-only"
severity = "error"
rationale = "The domain package is the shared contract at the center of the application. It may depend on validation libraries, but importing an HTTP server, React renderer, or Electron adapter would reverse the dependency direction and prevent independent reuse."
expr = "NOT ($domain_source AND $dependency_import_ref AND ($server_target OR $client_target OR $desktop_target))"
message = "The domain package must not import runtime adapters."

[[refs.where]]
id = "server-persistence@server-composition@server-database-ownership-is-confined"
severity = "error"
rationale = "SQLite and PostgreSQL are adapters owned by server-side persistence and wired by the Awilix composition root. Keeping database imports out of HTTP and business services preserves one authoritative persistence boundary."
expr = "$server_source AND (kind = 'imports_symbol' OR kind = 'imports_module' OR kind = 'reexports') AND $database_target => ($persistence_at_server_source OR $composition_at_server_source)"
message = "Server database imports are limited to persistence and the composition root."

[[refs.where]]
id = "desktop-client-dependency-crosses-http-not-source"
severity = "error"
rationale = "Electron hosts or connects to the HTTP server and loads the built renderer as web assets. A source import from desktop into the React client would couple packaging to renderer internals and blur the same boundary used by remote clients."
expr = "NOT ($desktop_source AND $dependency_import_ref AND $client_target)"
message = "Electron must load the client over HTTP instead of importing renderer source."

[[refs.where]]
id = "state-machine@domain-ownership-is-exclusive"
severity = "error"
rationale = "Meeting, Topic, council-decision, and ballot lifecycles are auditable domain contracts. XState definitions belong in the domain state-machine package; server commands consume exported transitions, while clients consume resulting state over HTTP instead of creating parallel lifecycle authorities."
expr = "(kind = 'imports_symbol' OR kind = 'imports_module' OR kind = 'reexports') AND $state_machine_runtime_target => $state_machine_at_domain_source"
message = "XState lifecycle definitions belong exclusively to packages/domain/src/state-machines."
